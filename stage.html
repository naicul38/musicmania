<!DOCTYPE HTML>
<html lang="en" data-theme="party">

<head>
    <title>Live Stage - Vicetream Tunes</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Watch live DJ performances on Vicetream Tunes" />
    
    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="stage.css" />
    <link rel="shortcut icon" href="assets/css/images/hiclipart.com.png" type="image/x-icon" />
    
    <!-- Configuration (generated from environment variables) -->
    <script src="config.js"></script>
    
    <script defer src="stage-viewer.js"></script>
</head>

<body>
    <div class="stage-app">
        <!-- Halftone overlay -->
        <div class="stage-halftone"></div>
        
        <!-- Video Feed (Live DJ Camera) -->
        <video id="liveFeed" class="camera-feed" autoplay playsinline></video>
        
        <!-- Audio Stream (Live DJ Audio) -->
        <audio id="liveAudio" autoplay></audio>
        
        <!-- Stage Overlay -->
        <div class="stage-overlay">
            <!-- Audio Visualizer -->
            <div class="stage-equalizer" id="equalizer">
                <div class="stage-eq-bar"></div>
                <div class="stage-eq-bar"></div>
                <div class="stage-eq-bar"></div>
                <div class="stage-eq-bar"></div>
                <div class="stage-eq-bar"></div>
                <div class="stage-eq-bar"></div>
                <div class="stage-eq-bar"></div>
                <div class="stage-eq-bar"></div>
            </div>
            
            <!-- Status Badge -->
            <div class="stage-status" id="statusBadge">
                <span class="stage-status-dot"></span>
                <span class="stage-status-text">OFFLINE</span>
            </div>
            
            <!-- DJ Name (when live) -->
            <div class="dj-name" id="djName" style="display: none;">
                <span id="djNameText">DJ Name</span>
            </div>
        </div>
        
        <!-- Empty Stage Message -->
        <div class="empty-stage" id="emptyStage">
            <div class="empty-stage-content">
                <div class="empty-stage-icon">🎵</div>
                <h2 class="empty-stage-title">No Live Performance</h2>
                <p class="empty-stage-text">Check back later or book your own session!</p>
                <a href="index.html" class="empty-stage-btn">← Back to Main</a>
            </div>
        </div>
        
        <!-- Back Button (when live) -->
        <a href="index.html" class="stage-back-btn" id="backBtn" style="display: none;">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
        </a>
    </div>
</body>

</html>
