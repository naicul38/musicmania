<!DOCTYPE HTML>
<html lang="en" data-theme="lounge">

<head>
    <title>Vicetream Tunes</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Stream curated radio stations - Lounge, Cool, Rock, Party, and Chill music" />
    
    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://ice1.somafm.com" />
    
    <!-- Google Fonts - Retro style -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="shortcut icon" href="assets/css/images/hiclipart.com.png" type="image/x-icon" />
    
    <script defer src="playback.js"></script>
</head>

<body>
    <div class="app">
        <!-- Halftone pattern overlay -->
        <div class="halftone-overlay"></div>
        
        <!-- Main content -->
        <main class="main-content">
            <!-- Logo -->
            <header class="header">
                <h1 class="logo">VICETREAM<span class="logo-accent">TUNES</span></h1>
                <p class="tagline">Select your vibe</p>
            </header>
            
            <!-- Floppy Disk Station Selector -->
            <div class="floppy-grid">
                <button class="floppy floppy--lounge active" data-stream="0" data-theme="lounge" aria-label="Lounge station">
                    <div class="floppy__slider"></div>
                    <div class="floppy__label">
                        <span class="floppy__label-text">LOUNGE</span>
                        <span class="floppy__label-sub">Mellow Vocals</span>
                    </div>
                    <div class="floppy__hole"></div>
                </button>
                
                <button class="floppy floppy--cool" data-stream="1" data-theme="cool" aria-label="Cool station">
                    <div class="floppy__slider"></div>
                    <div class="floppy__label">
                        <span class="floppy__label-text">COOL</span>
                        <span class="floppy__label-sub">Downtempo</span>
                    </div>
                    <div class="floppy__hole"></div>
                </button>
                
                <button class="floppy floppy--rock" data-stream="2" data-theme="rock" aria-label="Rock station">
                    <div class="floppy__slider"></div>
                    <div class="floppy__label">
                        <span class="floppy__label-text">ROCK</span>
                        <span class="floppy__label-sub">Heavy Metal</span>
                    </div>
                    <div class="floppy__hole"></div>
                </button>
                
                <button class="floppy floppy--party" data-stream="3" data-theme="party" aria-label="Party station">
                    <div class="floppy__slider"></div>
                    <div class="floppy__label">
                        <span class="floppy__label-text">PARTY</span>
                        <span class="floppy__label-sub">Dance Beats</span>
                    </div>
                    <div class="floppy__hole"></div>
                </button>
                
                <button class="floppy floppy--chill" data-stream="4" data-theme="chill" aria-label="Chill station">
                    <div class="floppy__slider"></div>
                    <div class="floppy__label">
                        <span class="floppy__label-text">CHILL</span>
                        <span class="floppy__label-sub">Ambient Space</span>
                    </div>
                    <div class="floppy__hole"></div>
                </button>
            </div>
            
            <!-- Now Playing -->
            <div class="now-playing">
                <span class="now-playing__label">NOW PLAYING</span>
                <span class="now-playing__station" id="stationName">Lounge</span>
            </div>
            
            <!-- Play/Pause Control -->
            <button class="play-btn" id="playbackButton" aria-label="Play or pause music">
                <svg class="play-btn__icon play-btn__icon--play" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <svg class="play-btn__icon play-btn__icon--pause" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>
        </main>
        
        <!-- Footer -->
        <footer class="footer">
            <a href="signup.html" class="footer__link" target="_blank" rel="noopener">Book a live event</a>
        </footer>
    </div>
</body>

</html>
